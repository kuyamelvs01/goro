name: Android APK

on:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
      - name: Build debug-signed arm64 APK
        run: packaging/android/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: goro-android-arm64-debug
          path: dist/android/goro-debug.apk
          if-no-files-found: error
